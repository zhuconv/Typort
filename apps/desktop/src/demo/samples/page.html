<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Typort HTML preview</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
      }
      .card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        padding: 2.5rem 3rem;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      h1 { margin: 0 0 0.5rem; font-size: 2rem; }
      p { margin: 0.35rem 0; opacity: 0.9; }
      code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 7px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HTML, rendered</h1>
      <p>This is the live preview of an HTML file.</p>
      <p>Switch to <code>Source</code> in the top bar to edit the markup —</p>
      <p>then switch back to see your changes.</p>
    </div>
  </body>
</html>
